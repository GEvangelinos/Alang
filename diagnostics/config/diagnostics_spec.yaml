#TODO: Add did you mean with levenstein distance!
# MacroDefinition
#  ├── Name: str
#  └── Body: list[MacroBodyLine]             # literal text / template lines (expanded inline)

# Diagnostic
#  ├──Name: str                     # e.g., MY_FAVORITE_DIAGNOSTIC
#  ├──Type: DiagnosticType          # e.g., WARNING, SOFT_ERROR, HARD_ERROR, NOTE, FATAL
#  ├──Primary: Issue                # exactly one
#  │    ├──Entry
#  │    ├──Suggestion?: Entry       # 0..1
#  │    └──Highlights?: list[Entry] # 0..N
#  └──Notes?: list[Issue]           # 0..N
#       ├──Entry
#       ├──Suggestion?: Entry       # 0..1
#       └──Highlights?: list[Entry] # 0..N

# Entry
#  ├──Message: str
#  ├──Args?: list[cpp_identifier] # Must contain as many names, as there are unique placeholders in 'Message'
#  └──Location: SourceLocation (C++ custom type)

# ======================================================================================
# ======================================================================================
# NOTE: SPECIAL DIAGNOSTIC CODE
# --------------------------------------------------------------------------------------
# SYNTAX_ERROR is special and hardcoded in the generator. It does NOT appear below in
# this YAML, since it has no template definition or reporter.
# It exists ONLY in the DiagnosticCode enum so the parser can tag generic syntax errors
# for diagnostics and regression testing.
# ======================================================================================
# ======================================================================================


#@macro TYPE_MESSAGE
#- Message: "type: {0}"

- Diagnostic: CALL_ARGUMENT_MISMATCH
  Type: WARNING
  Primary:
    - Message: "function `{0}` declared with `{1}` parameters but called with `{2}` arguments"
      Args: [ func_name, expected_arg_count, actual_arg_count ]
      Location: call_loc
  Notes:
    - Message: "function `{0}` declared here"
      Args: [ func_name ]
      Location: func_decl_loc

- Diagnostic: DIVISION_BY_ZERO
  Type: WARNING
  Primary:
    - Message: "Division by zero"
      Location: division_loc

- Diagnostic: IMPLICIT_INT_TO_FLOAT_LOSS
  Type: WARNING
  Primary:
    - Message: "integer to floating-point implicit conversion results in integral precision loss"
      Location: conversion_loc

- Diagnostic: UNINITIALIZED_RVALUE
  Type: WARNING
  Primary:
    - Message: "Use of uninitialized variable `{0}` as rvalue{1}"
      Args: [ var_name, multiple_times_message ]
      Location: variable_usage_loc
  Notes:
    - Message: "Variable `{0}` first declared here"
      Args: [ var_name ]
      Location: variable_decl_loc


- Diagnostic: EQUALITY_REL_OP_OPERAND_MISMATCH
  Type: SOFT_ERROR
  Primary:
    - Message: "Operands of `operator{0}` are not comparable"
      Args: [ operator_symbol ]
      Location: comp_operator_loc
      Highlights:
        # @use TYPE_MESSAGE
        Args: [ lhs_expr_type ]
        Location: lhs_expr_loc
        # @use TYPE_MESSAGE
        Args: [ rhs_expr_type ]
        Location: rhs_expr_loc

- Diagnostic: INVALID_CHARACTER
  Type: SOFT_ERROR
  Primary:
    - Message: "character {0} is invalid"
      Args: [ char_str ]
      Location: char_loc

- Diagnostic: INVALID_ESCAPE_CODE
  Type: SOFT_ERROR
  Primary:
    - Message: "invalid escape code {0} in string"
      Args: [ escape_code_str ]
      Location: escape_code_loc

- Diagnostic: INVALID_NUMERIC_SUFFIX
  Type: SOFT_ERROR
  Primary:
    - Message: "invalid suffix `{1}` on `{0}` literal"
      Args: [ numeric_type, suffix_str ]
      Location: full_literal_loc
      Highlights:
        - Message: "^invalid suffix"
          Location: suffix_loc

- Diagnostic: LIBFUNC_REDEFINED_AS_FORMAL_PARAMETER
  Type: SOFT_ERROR
  Primary:
    - Message: "`{0}` is a library function, can't declare it as formal parameter"
      Args: [ libfunc_name ]
      Location: formal_param_loc

- Diagnostic: NONARITH_ARITH_OP_OPERAND
  Type: SOFT_ERROR
  Primary:
    - Message: "`{0}` operand of arithmetic operator `{1}` is non-arithmetic"
      Args: [ operand_side, operator_symbol ]
      Location: operator_loc
      Highlights:
        # @use TYPE_MESSAGE
        Args: [ operand_expr_type ]
        Location: operand_loc

- Diagnostic: NONARITH_REL_OP_OPERAND
  Type: SOFT_ERROR
  Primary:
    - Message: "`{0}` operand of relational operator `{1}` is non-arithmetic"
      Args: [ operand_side, operator_symbol ]
      Location: operator_loc
      Highlights:
        # @use TYPE_MESSAGE
        Args: [ operand_expr_type ]
        Location: operand_loc

- Diagnostic: NONARITH_UMINUS_OPERAND
  Type: SOFT_ERROR
  Primary:
    - Message: "operand of unary `-` is non-arithmetic"
      Location: uminus_loc
      Highlights:
        # @use TYPE_MESSAGE
        Args: [ operand_expr_type ]
        Location: operand_loc

- Diagnostic: REDEFINITION_OF_FORMAL_PARAMETER
  Type: SOFT_ERROR
  Primary:
    - Message: "redefinition of formal parameter `{0}`"
      Args: [ param_name ]
      Location: param_loc
  Notes:
    - Message: "initial definition of formal parameter `{0}` is here"
      Args: [ param_name ]
      Location: initial_param_loc

- Diagnostic: REDEFINITION_OF_FUNC
  Type: SOFT_ERROR
  Primary:
    - Message: "redefinition of function `{0}`"
      Args: [ func_name ]
      Location: redef_loc
  Notes:
    - Message: "initial definition of function `{0}` here"
      Args: [ func_name ]
      Location: initial_def_loc

- Diagnostic: REDEFINITION_OF_LIBFUNC
  Type: SOFT_ERROR
  Primary:
    - Message: "redefinition of library function `{0}`"
      Args: [ libfunc_name ]
      Location: redef_loc

- Diagnostic: REDEFINITION_OF_VAR_AS_FUNC
  Type: SOFT_ERROR
  Primary:
    - Message: "`{0}` redefined as a function"
      Args: [ func_name ]
      Location: redef_loc
  Notes:
    - Message: "`{0}` initially defined as a variable here"
      Args: [ func_name ]
      Location: var_def_loc

- Diagnostic: ASSIGN_TO_FUNC
  Type: HARD_ERROR
  Primary:
    - Message: "assignment of function `{0}`"
      Args: [ func_name ]
      Location: assign_expr_loc
  Notes:
    - Message: "function `{0}` defined here"
      Args: [ func_name ]
      Location: func_def_loc

- Diagnostic: ASSIGN_TO_LIBFUNC
  Type: HARD_ERROR
  Primary:
    - Message: "assignment of library function `{0}`"
      Args: [ func_name ]
      Location: assign_expr_loc

# DEPRECATED (replaced by `OPERATOR_REQUIRES_NON_TEMP_LVALUE`)
- Diagnostic: ASSIGN_DIRECTLY_TO_TEMP
  Type: HARD_ERROR
  Primary:
    - Message: "assignment to temporary rvalue"
      Location: assign_expr_loc
      Highlights:
        - Message: "^temporary rvalue"
          Location: lhs_loc

- Diagnostic: INACCESSIBLE_VAR_IN_FUNC
  Type: HARD_ERROR
  Primary:
    - Message: "variable `{0}` is not accessible in function `{1}`"
      Args: [ id_name, curr_func_name ]
      Location: var_use_loc
  Notes:
    - Message: "function `{0}` declared here"
      Args: [ curr_func_name ]
      Location: func_decl_loc
    - Message: "variable `{0}` declared here"
      Args: [ id_name ]
      Location: var_decl_loc

- Diagnostic: LOCAL_ID_SHADOWS_LIBFUNC
  Type: HARD_ERROR
  Primary:
    - Message: "local identifier `{0}` shadows library function"
      Args: [ libfunc_name ]
      Location: id_use_loc

- Diagnostic: LOOP_CTRL_KEYWORD_OUTSIDE_LOOP
  Type: HARD_ERROR
  Primary:
    - Message: "`{0}` statement not in loop statement"
      Args: [ loop_keyword_name ]
      Location: loop_keyword_loc

- Diagnostic: OPERATOR_REQUIRES_LVALUE
  Type: HARD_ERROR
  Primary:
    - Message: "{0} `operator{1}` requires an lvalue {2}"
      Args: [ operator_name, operator_symbol, lvalue_subject ]
      Location: operator_loc
      Highlights:
        - Message: "{0} type: {1}"
          Args: [ lvalue_subject, found_type ]
          Location: rvalue_loc

- Diagnostic: OPERATOR_REQUIRES_NON_TEMP_LVALUE
  Type: HARD_ERROR
  Primary:
    - Message: "{0} `operator{1}` requires a non-temporary lvalue {2}"
      Args: [ operator_name, operator_symbol, lvalue_subject ]
      Location: full_expr_loc
  Notes:
    - Message: "current `{0}` is a temporary `{1}`"
      Args: [ lvalue_subject, found_type ]
      Location: rvalue_loc
      Highlights:
        - Message: "type: temporary {0}"
          Args: [ found_type ]
          Location: rvalue_loc

- Diagnostic: OPERATOR_ON_LVALUE_CASTED_TO_RVALUE
  Type: HARD_ERROR
  Primary:
    - Message: "`{0}` `operator{1}` requires lvalue (operand was an lvalue, but cast to rvalue)"
      Args: [ operator_name, operator_symbol ]
      Location: full_expr_loc
      Highlights:
        - Message: "^remove to uncast"
          Location: lhs_caster_loc
        - Message: "^remove to uncast"
          Location: rhs_casted_loc

- Diagnostic: RETURN_KEYWORD_OUTSIDE_FUNC
  Type: HARD_ERROR
  Primary:
    - Message: "`return` outside of function"
      Location: return_keyword_loc

- Diagnostic: SYNTAX_ERROR_EXPECTED
  Type: HARD_ERROR
  Primary:
    - Message: "expected `{0}`"
      Args: [ expected_token ]
      Location: unexpected_token_loc
      Suggestion:
        - Message: "{0}"
          Args: [ expected_token ]
          Location: insert_hint_loc

- Diagnostic: SYNTAX_ERROR_EXPECTED_BEFORE
  Type: HARD_ERROR
  Primary:
    - Message: "expected `{0}`, before `{1}`"
      Args: [ expected_token, unexpected_token ]
      Location: unexpected_token_loc
      Suggestion:
        - Message: "{0}"
          Args: [ expected_token ]
          Location: insert_hint_loc

- Diagnostic: SYNTAX_ERROR_EXPECTED_CLOSER
  Type: HARD_ERROR
  Primary:
    - Message: "expected `{0}` but found `{1}`"
      Args: [ closer_token, unexpected_token ]
      Location: unexpected_token_loc
      Suggestion:
        - Message: "{0}"
          Args: [ closer_token ]
          Location: insert_after_loc
  Notes:
    - Message: "to match this `{0}`"
      Args: [ opener_token ]
      Location: opener_loc

- Diagnostic: SYNTAX_ERROR_EXPECTED_EXPRESSION
  Type: HARD_ERROR
  Primary:
    - Message: "expected expression, found `{0}`"
      Args: [ unexpected_token ]
      Location: unexpected_token_loc
      Suggestion:
        - Message: "expr"
          Location: insert_hint_loc

- Diagnostic: SYNTAX_ERROR_EXPECTED_INSTEAD_OF
  Type: HARD_ERROR
  Primary:
    - Message: "expected `{0}` instead of `{1}`"
      Args: [ expected_tokens_sep_with_or, unexpected_token ]
      Location: unexpected_token_loc
      Suggestion:
        - Message: "{0}"
          Args: [ expected_tokens_sep_with_newline ]
          Location: insert_hint_loc

- Diagnostic: SYNTAX_ERROR_EXPECTED_INSTEAD_OF_WITHOUT_SUGGESTION
  Type: HARD_ERROR
  Primary:
    - Message: "expected `{0}` instead of `{1}`"
      Args: [ expected_tokens_sep_with_or, unexpected_token ]
      Location: unexpected_token_loc

- Diagnostic: SYNTAX_ERROR_REMOVE_OR_ADD
  Type: HARD_ERROR
  Primary:
    - Message: "remove `{0}`"
      Args: [ token_to_remove ]
      Location: remove_loc
  Notes:
    - Message: "you could instead add an `{0}`"
      Args: [ entity_to_add ]
      Location: remove_loc
      Suggestion:
        - Message: "{0}"
          Args: [ entity_to_add ]
          Location: remove_loc

- Diagnostic: SYNTAX_ERROR_UNEXPECTED
  Type: HARD_ERROR
  Primary:
    - Message: "unexpected `{0}`"
      Args: [ unexpected_token ]
      Location: unexpected_token_loc

- Diagnostic: UNRESOLVED_GLOBAL_SYMBOL
  Type: HARD_ERROR
  Primary:
    - Message: "symbol `{0}` not found in global scope"
      Args: [ symbol_name ]
      Location: symbol_use_loc

# ======================================================================================
# NOTE ON UNCLOSED TOKENS
# --------------------------------------------------------------------------------------
# UNCLOSED_COMMENT and UNCLOSED_STRING are marked as FATAL_ERROR. They act like "vacuums":
# once triggered, the lexer may still hit EOF. Making them FATAL, skips the rest hallucinating
# diagnostics.
# ======================================================================================
- Diagnostic: UNCLOSED_COMMENT
  Type: FATAL_ERROR
  Primary:
    - Message: "unclosed comment, missing terminating `*/`"
      Location: comment_start_loc

- Diagnostic: UNCLOSED_STRING
  Type: FATAL_ERROR
  Primary:
    - Message: "unclosed string literal, missing terminating `\"` character"
      Location: string_start_loc

- Diagnostic: PARSER_STACK_EXHAUSTED
  Type: FATAL_ERROR
  Primary:
    - Message: "parser stack exhausted (max-depth = {0})"
      Args: [ stack_limit ]
      Location: fatal_loc

- Diagnostic: __WTF__
  Type: FATAL_ERROR
  Primary:
    - Message: "`{0}`"
      Args: [ message ]
      Location: loc
