- Diagnostic: ASSIGNMENT_LHS_NOT_LVALUE
  Type: ERROR
  Primary:
    - Message: "Lvalue required as left operand of assignment. Left operand's expression type is `{0}`"
      Args: [ lhs_type ]
      Location: lhs_loc

- Diagnostic: ASSIGNMENT_OF_FUNC
  Type: ERROR
  Primary:
    - Message: "Assignment of function `{0}`"
      Args: [ func_name ]
      Location: assign_loc
  Notes:
    - Message: "Function `{0}` defined here"
      Args: [ func_name ]
      Location: func_def_loc

- Diagnostic: ASSIGNMENT_OF_LIBFUNC
  Type: ERROR
  Primary:
    - Message: "Assignment of library function `{0}`"
      Args: [ func_name ]
      Location: assign_loc